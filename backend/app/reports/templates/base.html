<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · {{ case.id }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--accent:#2563eb;--ok:#059669;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--fg);font:13px/1.55 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.page{max-width:980px;margin:0 auto;padding:40px 32px}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}h2{font-size:14px;font-weight:600;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.meta{color:var(--muted);font-size:12px}.brand{font-weight:600;font-size:12px;color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{border:1px solid var(--line);border-radius:6px;padding:12px}
.kpi b{display:block;font-size:20px;font-weight:600}.kpi span{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid var(--line)}
.passed{color:var(--ok);border-color:#a7f3d0;background:#ecfdf5}.failed{color:var(--bad);border-color:#fecaca;background:#fef2f2}
.pending,.running,.awaiting_approval{color:var(--warn);border-color:#fde68a;background:#fffbeb}
code,pre{font-family:"JetBrains Mono",monospace;font-size:11.5px}pre{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.sig{border-top:1px solid var(--line);margin-top:32px;padding-top:12px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}
@media print{.page{padding:0}.noprint{display:none}}
.noprint button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
</style></head><body><div class="page">
<header><div><div class="brand">FIELD-TO-FIX</div><h1>{{ title }}</h1>
<div class="meta">{{ case.id }} · {{ case.title }}</div></div>
<div class="meta" style="text-align:right">Generated {{ generated }}<br>Status <span class="chip {{ 'passed' if case.status.value=='closed' else 'pending' }}">{{ case.status.value }}</span>
<div class="noprint" style="margin-top:8px"><button onclick="print()">Save as PDF</button></div></div></header>
{% block body %}{% endblock %}
<div class="sig"><span>Generated by Loopback agents from recorded stage runs. Machine-generated content must be reviewed by the release owner.</span><span>{{ case.id }}</span></div>
</div></body></html>
